<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#7cc4f8" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<title>華景計劃</title>
<style>
  :root {
    --blue: #3b82f6;
    --blue-deep: #2563eb;
    --ink: #1e3a5f;
    --muted: #5b7a9d;
    --glass: rgba(255, 255, 255, 0.38);
    --glass-border: rgba(255, 255, 255, 0.6);
    --ok: #0f9d8f;
    --warn: #e0457b;
    --pink: #f8a5c2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Noto Sans TC", "Heiti TC", sans-serif;
    color: var(--ink);
    background: linear-gradient(168deg, #d3dfed 0%, #bfd0e2 32%, #d5e1ee 62%, #e7edf5 100%);
    background-attachment: fixed;
    min-height: 100dvh;
    padding-bottom: 92px;
    overflow-x: hidden;
  }
  /* 🌧️ 雨滴（兩個主題都有：雨天玻璃窗感） */
  .rain { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .drop {
    position: absolute; top: -14%; width: 2px; height: 16px; border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.6));
    animation: rainfall linear infinite;
  }
  @keyframes rainfall {
    0% { transform: translateY(-12vh) rotate(10deg); opacity: 0; }
    12% { opacity: .9; }
    100% { transform: translateY(112vh) rotate(10deg); opacity: 0; }
  }
  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 14px 14px 0; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px 12px;
  }
  header.top h1 { font-size: 24px; margin: 0; letter-spacing: 1px; }
  header.top .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .btn {
    border: none; cursor: pointer; font-family: inherit;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--ink); border-radius: 14px; padding: 9px 14px; font-size: 14px;
  }
  .btn.primary { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: #fff; border-color: rgba(255,255,255,.5); }
  .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
  .btn.active { background: linear-gradient(135deg, #60a5fa, #3b82f6); color: #fff; }
  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px) saturate(135%);
    -webkit-backdrop-filter: blur(18px) saturate(135%);
    border-radius: 22px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 8px 28px rgba(80,110,150,.16), inset 0 1px 0 rgba(255,255,255,.6);
  }
  .card h2 { margin: 0 0 2px; font-size: 17px; }
  .card .desc { margin: 0 0 10px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat {
    background: rgba(255,255,255,.45); border-radius: 16px; padding: 10px 12px;
    border: 1px solid rgba(255,255,255,.55);
  }
  .stat .lb { font-size: 11.5px; color: var(--muted); }
  .stat .val { font-size: 19px; font-weight: 700; margin-top: 2px; }
  .stat .hint { font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .val.ok { color: var(--ok); } .val.warn { color: var(--warn); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--ink); font-weight: 600; margin-bottom: 5px; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .field input[type=text] {
    width: 100%; font-size: 16px; padding: 11px 14px;
    background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.7);
    border-radius: 14px; color: var(--ink); font-family: inherit;
  }
  .field input:focus { outline: 2px solid var(--blue); outline-offset: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .switch-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(255,255,255,.45); border-radius: 16px; padding: 11px 14px;
    border: 1px solid rgba(255,255,255,.55); margin-bottom: 10px;
  }
  .switch-row .t { font-size: 14px; font-weight: 600; }
  .switch-row .s { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
  .switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px; background: #b8c9de; transition: .2s;
  }
  .switch .dot {
    position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .switch input:checked + .track { background: var(--blue); }
  .switch input:checked + .track + .dot { transform: translateX(20px); }
  .school {
    text-align: left; width: 100%; cursor: pointer; margin-bottom: 10px;
    background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.6);
    border-radius: 18px; padding: 12px 14px; font-family: inherit; color: var(--ink);
  }
  .school.sel { border: 2px solid var(--blue); background: rgba(219,234,254,.75); }
  .school .top { display: flex; justify-content: space-between; align-items: baseline; }
  .school .nm { font-size: 15.5px; font-weight: 700; }
  .school .fee { font-size: 13px; color: var(--muted); }
  .school .pg { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .badge {
    font-size: 10.5px; padding: 3px 8px; border-radius: 999px;
    background: rgba(255,255,255,.65); color: var(--ink);
  }
  .badge.b-ok { background: rgba(15,157,143,.15); color: var(--ok); }
  .badge.b-warn { background: rgba(224,69,123,.12); color: var(--warn); }
  .badge.b-blue { background: rgba(59,130,246,.14); color: var(--blue-deep); }
  .school .note { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .school .win { font-size: 11px; color: var(--blue-deep); margin-top: 4px; }
  .warnbox {
    background: rgba(224,69,123,.1); border: 1px solid rgba(224,69,123,.25);
    border-radius: 16px; padding: 10px 12px; font-size: 12.5px; color: #b02455;
    margin-bottom: 8px; line-height: 1.55;
  }
  .okbox {
    background: rgba(15,157,143,.1); border: 1px solid rgba(15,157,143,.25);
    border-radius: 16px; padding: 10px 12px; font-size: 12.5px; color: #0b7a6f;
  }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 150px; margin-top: 4px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .col .v { font-size: 9.5px; color: var(--muted); white-space: nowrap; }
  .bars { position: relative; width: 100%; height: 96px; background: rgba(255,255,255,.25); border-radius: 8px; overflow: hidden; }
  .bars .mid { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(30,58,95,.25); }
  .bars .up { position: absolute; bottom: 50%; left: 12%; width: 76%; background: linear-gradient(180deg,#93c5fd,#3b82f6); border-radius: 5px 5px 0 0; }
  .bars .dn { position: absolute; top: 50%; left: 12%; width: 76%; background: linear-gradient(180deg,#f472b6,#e0457b); border-radius: 0 0 5px 5px; }
  .col .y { font-size: 9.5px; color: var(--muted); margin-top: 4px; }
  .tl { position: relative; padding-left: 20px; }
  .tl::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: rgba(59,130,246,.3); }
  .tl .item { position: relative; padding-bottom: 13px; }
  .tl .item::before {
    content: "🌷"; position: absolute; left: -20px; top: 0; font-size: 13px;
  }
  .tl .y { font-size: 11px; font-weight: 700; color: var(--blue-deep); }
  .tl .t { font-size: 13.5px; font-weight: 600; margin-top: 1px; }
  .tl .d { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
  .task {
    display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
    background: rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.6);
    border-radius: 16px; padding: 11px 13px; margin-bottom: 9px;
  }
  .task .box {
    width: 21px; height: 21px; border-radius: 7px; flex-shrink: 0; margin-top: 1px;
    border: 2px solid #93c5fd; background: rgba(255,255,255,.6);
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff;
  }
  .task.done .box { background: var(--blue); }
  .task.done .tt { text-decoration: line-through; color: var(--muted); }
  .task .tt { font-size: 13.5px; font-weight: 600; }
  .task .dd { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .phase { font-size: 12px; font-weight: 700; color: var(--blue-deep); margin: 12px 0 8px; }
  .phase:first-child { margin-top: 0; }
  nav.bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-top: 1px solid rgba(255,255,255,.7);
    display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav.bottom button {
    background: none; border: none; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10.5px; color: var(--muted); padding: 4px 10px; border-radius: 12px;
  }
  nav.bottom button.on { color: var(--blue-deep); font-weight: 700; background: rgba(147,197,253,.35); }
  nav.bottom .ic { font-size: 20px; }
  .progress { height: 10px; border-radius: 999px; background: rgba(255,255,255,.5); overflow: hidden; }
  .progress > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#93c5fd,#3b82f6); transition: width .3s; }
  .prog-label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  input[type=range] { width: 100%; accent-color: var(--blue); }
  .tuition-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,.45); border-radius: 14px; padding: 10px 13px; margin-bottom: 8px;
  }
  .tuition-row .tt { font-size: 13px; }
  .tuition-row .amt { font-size: 16px; font-weight: 700; }
  .hidden { display: none; }
  /* 備份 modal：inline style 有 display:flex，必須用 !important 蓋過先可以真正關閉 */
  #backupModal.hidden { display: none !important; }

  /* ============ 🌃 深色模式（雨夜城市 · Rainy City Window） ============ */
  body[data-theme="dark"] {
    --ink: #e8f0f8;
    --muted: #94a9c0;
    --blue: #6fb6e8;
    --blue-deep: #a8d8f0;
    --ok: #7fd1b9;
    --warn: #e58ba6;
    background:
      radial-gradient(ellipse at 22% 78%, rgba(255,170,90,.10), transparent 55%),
      radial-gradient(ellipse at 78% 70%, rgba(120,190,255,.10), transparent 52%),
      linear-gradient(180deg, #0b1220 0%, #121d33 45%, #1a2947 100%);
    background-attachment: fixed;
  }
  /* 城市天際線剪影 + 地平線燈光 */
  body[data-theme="dark"]::before {
    content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 46vh;
    z-index: 0; pointer-events: none;
    background:
      repeating-linear-gradient(90deg, #0c1526 0 30px, transparent 30px 38px, #0c1526 38px 64px, transparent 64px 72px, #0c1526 72px 92px, transparent 92px 100px) bottom/100% 110px no-repeat,
      repeating-linear-gradient(90deg, #0e1a30 0 46px, transparent 46px 58px, #0e1a30 58px 88px, transparent 88px 96px, #0e1a30 96px 128px, transparent 128px 136px) bottom/100% 72px no-repeat,
      linear-gradient(180deg, transparent, rgba(255,170,90,.05) 92%, rgba(255,170,90,.09));
  }
  body[data-theme="dark"] .card {
    background: rgba(13,20,36,.62);
    border-color: rgba(140,170,210,.26);
    backdrop-filter: blur(24px) saturate(130%);
    -webkit-backdrop-filter: blur(24px) saturate(130%);
    box-shadow: 0 12px 38px rgba(0,0,0,.5), inset 0 1px 0 rgba(190,220,255,.07);
  }
  body[data-theme="dark"] .btn { color: #eaf3fb; }
  body[data-theme="dark"] .btn.primary,
  body[data-theme="dark"] .btn.active { background: linear-gradient(135deg, #8fd0f2, #4f9fd8); color: #0a1626; border-color: rgba(190,225,255,.4); }
  body[data-theme="dark"] .stat,
  body[data-theme="dark"] .switch-row,
  body[data-theme="dark"] .school,
  body[data-theme="dark"] .task,
  body[data-theme="dark"] .tuition-row { background: rgba(150,180,220,.08); border-color: rgba(140,170,210,.24); }
  body[data-theme="dark"] .school.sel { background: rgba(111,182,232,.14); border: 2px solid #6fb6e8; }
  body[data-theme="dark"] .field input { background: rgba(6,10,20,.5); border-color: rgba(140,170,210,.3); color: #eaf3fb; }
  body[data-theme="dark"] .field input:focus { outline-color: #6fb6e8; }
  body[data-theme="dark"] .switch .track { background: #24344f; }
  body[data-theme="dark"] .badge { background: rgba(150,180,220,.14); color: #e2edf7; }
  body[data-theme="dark"] .badge.b-blue { background: rgba(111,182,232,.18); }
  body[data-theme="dark"] .badge.b-ok { background: rgba(127,209,185,.16); }
  body[data-theme="dark"] .badge.b-warn { background: rgba(229,139,166,.16); }
  body[data-theme="dark"] .warnbox { background: rgba(229,139,166,.14); border-color: rgba(229,139,166,.38); color: #f2b3c5; }
  body[data-theme="dark"] .okbox { background: rgba(127,209,185,.12); border-color: rgba(127,209,185,.32); color: #b5e3d5; }
  body[data-theme="dark"] .chart .bars { background: rgba(150,180,220,.08); }
  body[data-theme="dark"] .bars .mid { background: rgba(200,220,240,.25); }
  body[data-theme="dark"] .bars .up { background: linear-gradient(180deg, #9fd8f0, #4f9fd8); }
  body[data-theme="dark"] .bars .dn { background: linear-gradient(180deg, #e58ba6, #c2436b); }
  body[data-theme="dark"] .tl::before { background: rgba(111,182,232,.35); }
  body[data-theme="dark"] .task .box { border-color: #6fb6e8; background: rgba(150,180,220,.14); }
  body[data-theme="dark"] nav.bottom { background: rgba(8,13,24,.92); border-top-color: rgba(140,170,210,.25); }
  body[data-theme="dark"] nav.bottom button.on { background: rgba(111,182,232,.22); color: #a8d8f0; }
  body[data-theme="dark"] .progress { background: rgba(150,180,220,.14); }
  body[data-theme="dark"] .progress > div { background: linear-gradient(90deg, #9fd8f0, #4f9fd8); }
</style>
</head>
<body>
<div class="rain">
  <div class="drop" style="left:8%;  animation-duration:1.3s; animation-delay:0s"></div>
  <div class="drop" style="left:18%; animation-duration:1.1s; animation-delay:.4s"></div>
  <div class="drop" style="left:29%; animation-duration:1.5s; animation-delay:.9s"></div>
  <div class="drop" style="left:40%; animation-duration:1.2s; animation-delay:.2s"></div>
  <div class="drop" style="left:51%; animation-duration:1.4s; animation-delay:.7s"></div>
  <div class="drop" style="left:62%; animation-duration:1.1s; animation-delay:1.1s"></div>
  <div class="drop" style="left:73%; animation-duration:1.5s; animation-delay:.3s"></div>
  <div class="drop" style="left:83%; animation-duration:1.2s; animation-delay:.8s"></div>
  <div class="drop" style="left:92%; animation-duration:1.4s; animation-delay:.5s"></div>
  <div class="drop" style="left:35%; animation-duration:1.6s; animation-delay:1.4s"></div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1>華景計劃</h1>
      <div class="sub" id="subTitle">華富邨 → MSW → 350呎居屋 · 雨天玻璃</div>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn small" id="btnTheme">🎨 換主題</button>
      <button class="btn small" id="btnReset">重設</button>
      <button class="btn small" id="btnBackup">💾</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="backupModal" class="hidden" style="position:fixed;inset:0;z-index:99;background:rgba(20,35,60,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px">
  <div class="card" style="width:100%;max-width:420px;margin:0">
    <h2>數據備份 💾</h2>
    <p class="desc">數字同待辦會自動存喺每部機（唔會自動同步）。下載一份「備份檔」放喺 iCloud／WhatsApp／Email，第時任何機都還原到。</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn primary" onclick="exportBackup()">⬇️ 下載備份檔</button>
      <label class="btn" style="text-align:center;cursor:pointer">⬆️ 揀備份檔還原
        <input type="file" accept=".json,application/json" id="importFile" style="display:none" onchange="importBackup(event)">
      </label>
      <button class="btn" onclick="document.getElementById('backupModal').classList.add('hidden')">關閉</button>
    </div>
  </div>
</div>

<nav class="bottom" id="nav">
  <button data-tab="home"><span class="ic">🏠</span>總覽</button>
  <button data-tab="budget"><span class="ic">💰</span>預算</button>
  <button data-tab="study"><span class="ic">🎓</span>升學</button>
  <button data-tab="hos"><span class="ic">🏡</span>居屋</button>
  <button data-tab="repay"><span class="ic">💳</span>還款</button>
  <button data-tab="tasks"><span class="ic">✅</span>待辦</button>
</nav>

// ================= 計算 =================
function hkd(n) { return "$" + Math.round(n).toLocaleString("en-HK"); }
function fmtWan(n) {
  const a = Math.abs(n);
  if (a >= 100000) return (n<0?"−":"") + "$" + (a/10000).toFixed(a>=1000000?1:0) + "萬";
  return (n<0?"−$":"$") + Math.round(a).toLocaleString("en-HK");
}
function mpfOf(s) { return s < 7100 ? 0 : Math.min(s*0.05, 1500); }
function taxForYear(salary, dadAge) {
  const annual = salary*12, mpf = mpfOf(salary)*12;
  const parent = dadAge>=60 ? 110000 : dadAge>=55 ? 55000 : 0;
  const chargeable = annual - mpf - 145000 - parent;
  if (chargeable <= 0) return 0;
  const bands = [50000,50000,50000,50000], rates = [0.02,0.06,0.10,0.14];
  let left = chargeable, tax = 0;
  for (let i=0;i<4;i++){ const t=Math.min(left,bands[i]); tax+=t*rates[i]; left-=t; if(left<=0) return tax; }
  return tax + left*0.17;
}
function mortgage(principal, rate, years) {
  const r = rate/12, n = years*12;
  if (principal<=0||n<=0) return 0;
  return principal*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
}
function monthlyFlow(salary, burn, dadAge) {
  return salary - mpfOf(salary) - burn - taxForYear(salary, dadAge)/12;
}
function compute() {
  const burn = S.rent + S.dad + S.living + S.emergency;
  const mpf = mpfOf(S.salary);
  const nowYear = new Date().getFullYear();
  const dadAgeNow = nowYear - S.dadBirthYear;
  const taxM = taxForYear(S.salary, dadAgeNow)/12;
  const leftover = S.salary - mpf - burn - taxM;

  const jobStart = new Date(2026,9,1);
  const now = new Date();
  const start = now > jobStart ? now : jobStart;
  const intake = new Date(S.intakeYear,8,1);
  const months = Math.max(0, (intake.getFullYear()-start.getFullYear())*12 + (intake.getMonth()-start.getMonth()));
  const savingsAtIntake = S.currentSavings + leftover*months;
  const emergencyAtIntake = S.emergency*months;

  const subsidy = Math.min(Math.max(0, S.tuition-49500), 100000);
  const ftssPay = Math.max(49500, S.tuition-subsidy);
  const tuitionNeeded = S.hasEnls ? 0 : (S.hasFtss ? ftssPay : S.tuition);

  const studyYears = S.mode==="pt" ? S.ptYears : S.ftYears;
  const perYear = tuitionNeeded/studyYears;
  const studyFlow = monthlyFlow(S.studySalary, burn, 60);
  const balanceAtGrad = savingsAtIntake + studyFlow*studyYears*12 - tuitionNeeded;
  const ptGap = Math.max(0, perYear - studyFlow*12);

  // ENLS 還款估算（學資處 2026-27：年息 2.173%（2025-12-01 調整）、行政費 $285/年、還款期最長 15 年）
  const enlsPerYear = S.tuition / studyYears;
  let enlsBal = 0;
  for (let k = 0; k < studyYears; k++) enlsBal = (enlsBal + enlsPerYear) * (1 + S.enlsRate);
  const enlsAdmin = 285 * (studyYears + S.enlsYears);
  const enlsTotal = enlsBal + enlsAdmin;
  const enlsMonthly = mortgage(enlsTotal, S.enlsRate, S.enlsYears);
  const enlsInt = enlsBal - S.tuition;

  const gradYear = S.intakeYear + studyYears;
  const aswoStartYear = gradYear + S.aswoDelay/12;
  const monthsPost = Math.min(S.aswoDelay, Math.max(0,(S.buyYear - gradYear)*12));
  const monthsAswo = Math.max(0,(S.buyYear - gradYear)*12 - monthsPost);
  const postFlow = monthlyFlow(S.postGradSalary, burn, 60);
  const aswoFlow = monthlyFlow(S.aswoSalary, burn, 60);

  const savingsByBuy = savingsAtIntake - tuitionNeeded + studyFlow*studyYears*12
    + postFlow*monthsPost + aswoFlow*monthsAswo;

  const down = S.hosPrice*0.05;
  const monthlyMortgage = mortgage(S.hosPrice - down, S.rate, S.years);
  const dadAgeAtBuy = S.buyYear - S.dadBirthYear;
  const enlsActive = !!S.hasEnls;
  const monthlyBurden = (enlsActive ? enlsMonthly : 0) + monthlyMortgage;
  const burdenRatio = S.aswoSalary > 0 ? monthlyBurden / S.aswoSalary : 0;
  const aswoLeftover = aswoFlow - monthlyBurden;
  const aswoLeftoverBuy = aswoLeftover + S.rent - S.hosMgmtFee;

  const warnings = [];
  if (S.mode==="pt" && !S.hasEnls && balanceAtGrad < 0)
    warnings.push("⚠️ 兼讀期間人工得 $"+S.studySalary.toLocaleString("en-HK")+"／月，每月淨流 $"+Math.round(studyFlow).toLocaleString("en-HK")+"，畢業一刻積蓄會跌到 "+hkd(balanceAtGrad)+"——唔得。出路：保住全職（夜晚+週末上課）、申請 ENLS、或遲一年入學儲夠先讀。");
  else if (S.mode==="pt" && !S.hasEnls && ptGap > 0)
    warnings.push("兼讀期間每年學費約 "+hkd(perYear)+"，而兼讀月淨流只得 "+hkd(studyFlow)+"，要用入學前積蓄墊住，"+studyYears+" 年共要補約 "+hkd(ptGap*studyYears)+"。");
  if (S.mode==="ft" && !S.hasEnls)
    warnings.push("全日制無 ENLS 嘅話，學費加生活費差大約 $38 萬，而家呢盤數做唔到。");
  if (savingsByBuy < down + 80000)
    warnings.push("按而家速度，"+S.buyYear+" 年積蓄可能剛剛夠綠表首期，要預多啲雜費同裝修。");
  if (monthlyMortgage/S.aswoSalary > 0.4)
    warnings.push("月供超過 ASWO 入息 40%，揀平啲屋苑或者加長還款期。");

  return { burn, mpf, taxM, leftover, months, savingsAtIntake, emergencyAtIntake,
    studyFlow, balanceAtGrad, ptGap, tuitionNeeded, ftssPay, perYear, studyYears,
    gradYear, savingsByBuy, down, monthlyMortgage, dadAgeAtBuy, aswoFlow, postFlow, warnings,
    enlsPerYear, enlsBal, enlsAdmin, enlsTotal, enlsMonthly, enlsInt,
    monthlyBurden, burdenRatio, aswoLeftover, aswoLeftoverBuy };
}

function balances() {
  const c = compute();
  const points = [];
  const jobStart = new Date(2026,9,1);
  const now = new Date();
  const start = now > jobStart ? now : jobStart;
  const end = new Date(S.buyYear,11,31);
  const studyStart = new Date(S.intakeYear,8,1);
  const gradDate = new Date(S.intakeYear + (S.mode==="pt"?S.ptYears:S.ftYears),8,1);
  const aswoDate = new Date(gradDate); aswoDate.setMonth(aswoDate.getMonth()+S.aswoDelay);
  let bal = S.currentSavings;
  const t = new Date(start);
  while (t <= end) {
    const y = t.getFullYear();
    let flow = c.leftover;
    if (t >= studyStart && t < gradDate) {
      flow = c.studyFlow;
      const k = y - S.intakeYear;
      if (t.getMonth()===8 && k>=0 && k<c.studyYears) bal -= c.perYear;
    } else if (t >= gradDate && t < aswoDate) {
      flow = c.postFlow;
    } else if (t >= aswoDate) {
      flow = c.aswoFlow;
    }
    bal += flow;
    if (t.getMonth()===11) points.push({ year:y, balance:Math.round(bal) });
    t.setMonth(t.getMonth()+1);
  }
  return points;
}

function milestones() {
  const c = compute();
  const jobStart = new Date(2026,9,1);
  const now = new Date();
  const t0 = (now > jobStart) ? new Date(now.getFullYear(), now.getMonth(), 1) : jobStart;
  const studyStart = new Date(S.intakeYear,8,1);
  const gradDate = new Date(S.intakeYear + (S.mode==="pt"?S.ptYears:S.ftYears),8,1);
  const aswoDate = new Date(gradDate); aswoDate.setMonth(aswoDate.getMonth()+S.aswoDelay);
  const end = new Date(S.buyYear,11,31);
  const cp = [];
  for (let y = t0.getFullYear(); y <= S.buyYear; y++) {
    const j = new Date(y,5,30), d = new Date(y,11,31);
    if (j >= t0 && j <= end) cp.push(j);
    if (d >= t0 && d <= end) cp.push(d);
  }
  [S.intakeYear, gradDate.getFullYear(), aswoDate.getFullYear(), S.buyYear].forEach(yy => {
    const d = new Date(yy,8,30);
    if (d >= t0 && d <= end) cp.push(d);
  });
  cp.sort((a,b)=>a-b);
  let bal = S.currentSavings;
  const t = new Date(t0);
  const rows = [];
  cp.forEach(d => {
    while (t <= d) {
      const y = t.getFullYear();
      let f = c.leftover;
      if (t >= studyStart && t < gradDate) {
        f = c.studyFlow;
        const k = y - S.intakeYear;
        if (t.getMonth()===8 && k>=0 && k<c.studyYears) bal -= c.perYear;
      } else if (t >= gradDate && t < aswoDate) f = c.postFlow;
      else if (t >= aswoDate) f = c.aswoFlow;
      bal += f;
      t.setMonth(t.getMonth()+1);
    }
    const y = d.getFullYear(), mm = d.getMonth();
    let note = mm===11 ? "📆 年結" : "半年結";
    if (mm===8) {
      if (y===S.intakeYear) note = "🎓 入學（交咗第一期學費後）";
      else if (y===gradDate.getFullYear()) note = "🎉 畢業";
      else if (y===aswoDate.getFullYear()) note = "💼 升 ASWO 頭一年";
      else if (y===S.buyYear) note = "🏡 買樓前檢查";
    }
    rows.push({ ym: y+"年"+String(mm+1).padStart(2,"0")+"月", amt: Math.round(bal), note });
  });
  return rows;
}

const main = document.getElementById("main");

function el(html) { const d = document.createElement("div"); d.innerHTML = html; return d.firstElementChild; }

function field(label, key, hint, step) {
  const f = el(`<div class="field"><label>${label}</label>
    <input type="text" inputmode="decimal" data-key="${key}" value="${S[key]}">
    ${hint?`<div class="hint">${hint}</div>`:""}</div>`);
  f.querySelector("input").addEventListener("input", (e) => {
    let v = parseFloat(e.target.value.replace(/[^0-9.]/g,""));
    if (isNaN(v) || v < 0) v = 0;
    S[key] = v; save();
    render();
    // 打字後保留捲動位置 + 焦點留喺原輸入框
    const inp = document.querySelector(`input[data-key="${key}"]`);
    if (inp) {
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    }
  });
  return f;
}

function switchRow(title, sub, key) {
  const r = el(`<div class="switch-row"><div><div class="t">${title}</div><div class="s">${sub}</div></div>
    <label class="switch"><input type="checkbox" ${S[key]?"checked":""}><span class="track"></span><span class="dot"></span></label></div>`);
  r.querySelector("input").addEventListener("change", (e) => { S[key] = e.target.checked; save(); render(); });
  return r;
}

function stat(lb, val, hint, tone) {
  return `<div class="stat"><div class="lb">${lb}</div>
    <div class="val ${tone||""}">${val}</div>
    ${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}

        ${stat("買樓後實際每月剩", hkd(c.aswoLeftoverBuy), "已扣管理費、差餉、地租", c.aswoLeftoverBuy<2000?"warn":"ok")}
      </div>
      ${!enlsOn?`<div class="hint" style="font-size:11px;color:var(--muted);margin-top:6px">上面總負擔未計 ENLS：升學頁開返個掣就計埋。</div>`:""}
    </div>`;

  const rateIn = document.getElementById("enlsRateInput");
  if (rateIn) rateIn.addEventListener("input", (e) => {
    let v = parseFloat(e.target.value.replace(/[^0-9.]/g,""));
    if (isNaN(v) || v<0) v = 2.173;
    S.enlsRate = v/100; save(); render();
    const inp = document.getElementById("enlsRateInput");
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  });

  const mgmtBox = document.getElementById("hosMgmtField");
  if (mgmtBox) mgmtBox.appendChild(field("買樓後 管理費＋差餉＋地租（每月）","hosMgmtFee","買咗居屋就唔使再交華富邨租（慳 $3,000），改為交呢筆。350 呎居屋一般約 $1,000–1,500。"));
}

// --- 待辦 ---
const PHASE_ORDER = ["而家","開工後","2027 春–秋","2027 秋","2028","2030-31","2032–35"];
const PHASE_ICON = { "而家":"🌱", "開工後":"💼", "2027 春–秋":"✏️", "2027 秋":"🎓", "2028":"📚", "2030-31":"🎉", "2032–35":"🏡" };

function viewTasks() {
  const phases = {};
  TASKS.forEach(t => { (phases[t.ph] = phases[t.ph]||[]).push(t); });
  const keys = Object.keys(phases).sort((a,b) => PHASE_ORDER.indexOf(a) - PHASE_ORDER.indexOf(b));
  const html = keys.map(ph => `
    <div class="phase">${PHASE_ICON[ph]||"📌"} ${ph}</div>
    ${phases[ph].map(t => `
      <div class="task ${TASKDONE[t.id]?"done":""}" onclick="toggleTask('${t.id}')">
        <div class="box">${TASKDONE[t.id]?"✓":""}</div>
        <div><div class="tt">${t.t}</div><div class="dd">${t.d}</div></div>
      </div>`).join("")}`).join("");
  main.innerHTML = `<div class="card"><h2>待辦清單 ✅</h2><p class="desc">按時間線排好：由而家一路去到 2032–35 買樓。</p>${html}
    <button class="btn small" style="margin-top:8px" onclick="resetTasks()">重設待辦</button></div>`;
}

// ================= 事件 =================
window.pickSchool = function(k) {
  const s = SCHOOLS[k];
  S.school = k;
  if (s.fy === 0) S.mode = "pt";
  S.tuition = S.mode==="pt" ? s.pt : (s.ft ?? s.pt);
  S.ptYears = s.py; S.ftYears = s.fy;
  save(); render();
};
window.pickMode = function(m) {
  S.mode = m;
  const s = SCHOOLS[S.school];
  S.tuition = m==="pt" ? s.pt : (s.ft ?? s.pt);
  save(); render();
};
window.toggleTask = function(id) {
  TASKDONE[id] = !TASKDONE[id];
  saveTasks(); render();
};
window.resetTasks = function() { TASKDONE = {}; saveTasks(); render(); };

function render() {
  const sy = window.scrollY;
  const c = compute();
  if (TAB==="home") viewHome(c);
  else if (TAB==="budget") viewBudget(c);
  else if (TAB==="study") viewStudy(c);
  else if (TAB==="hos") viewHos(c);
  else if (TAB==="repay") viewRepay(c);
  else viewTasks();
  document.querySelectorAll("#nav button").forEach(b => {
    b.classList.toggle("on", b.dataset.tab===TAB);
  });
  window.scrollTo(0, sy);
}

nav.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  TAB = b.dataset.tab;
  render();
  window.scrollTo(0, 0); // 轉 tab 跳返頂部
});

document.getElementById("btnReset").addEventListener("click", () => {
  if (confirm("重設晒所有數字同待辦？")) {
    S = Object.assign({}, DEFAULTS);
    TASKDONE = {};
    save(); saveTasks(); render();
  }
});
document.getElementById("btnTheme").addEventListener("click", cycleTheme);
document.getElementById("btnBackup").addEventListener("click", () => {
  document.getElementById("backupModal").classList.remove("hidden");
});
document.getElementById("backupModal").addEventListener("click", (e) => {
  if (e.target.id === "backupModal") e.target.classList.add("hidden");
});
window.exportBackup = function() {
  const data = { v:1, exportedAt:new Date().toISOString(), state:S, tasks:TASKDONE, theme:THEME };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "\u83ef\u666f\u8a08\u528b\u5099\u4efd_" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
};
window.importBackup = function(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const d = JSON.parse(fr.result);
      if (!d || typeof d !== "object") throw 0;
      if (d.state) { S = Object.assign({}, DEFAULTS, d.state); save(); }
      if (d.tasks) { TASKDONE = d.tasks; saveTasks(); }
      if (d.theme === "blue" || d.theme === "dark") { THEME = d.theme; applyTheme(); }
      render();
      alert("\u9084\u539f\u5b8c\u50d1\uff01");
    } catch(e) { alert("\u9019\u500b\u4e0d\u4f3c\u5099\u4efd\u6a94\uff0c\u9e60\u9ebb\u9078\u8a06\u53e6\u4e00\u4efd\u3002"); }
  };
  fr.readAsText(f);
};
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
}

applyTheme();
render();
</script>
